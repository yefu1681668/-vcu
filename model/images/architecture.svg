  <rect x="640" y="120" width="200" height="52" rx="8" class="core"/>
  <text x="740" y="142" class="t">Simulink / Stateflow</text>
  <text x="740" y="160" class="ts">MBD 建模与代码生成</text>

  <rect x="640" y="200" width="200" height="52" rx="8" class="core"/>
  <text x="740" y="222" class="t">CANoe / CANalyzer</text>
  <text x="740" y="240" class="ts">CAPL 自动化测试 / HIL</text>

  <rect x="640" y="280" width="200" height="52" rx="8" class="core"/>
  <text x="740" y="302" class="t">Python MIL 参考实现</text>
  <text x="740" y="320" class="ts">14 项单元测试 / CI</text>

  <path class="e" d="M180 106 L248 180"/>
  <path class="e" d="M180 196 L248 196"/>
  <path class="e" d="M180 286 L248 212"/>
  <path class="e" d="M340 200 L378 200"/>
  <path class="e" d="M580 200 L638 146"/>
  <path class="e" d="M580 200 L638 226"/>
  <path class="e" d="M580 200 L638 306"/>
